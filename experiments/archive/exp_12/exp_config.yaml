# config for a grid search experiment based on wandb sweep config
# meant to be used with grid_search_experiment.py
# program: src/experiments/wandb_sweep_wrapper_single_seed.py
method: random
metric:
  goal: maximize
  name: test_return_mean

# params to grid search over
# all values assumed to be in lists
parameters:
  ##################
  # Seeds
  ##################
  # seeds are grid-searched over and are handled with a wrapper which assigns each combo of params (except seeds) a unique scenario index
  # use fixed seeds like this to enable reproducible results
  # seed:
  #   values: [180335, 259851, 409900, 105160, 371020]
  # use random seeds for high-quality results to help avoid cherry picking seeds that make your results look good
  n_seeds:
    values: [3]

  ##################
  # Project setup + logging
  ##################
  wandb_project:
    values: [comm_experiments]
  # use offline mode to avoid wandb API rate limits for many parallel runs
  # need to sync to wandb server after a run is finished
  wandb_mode:
    values: [offline]
  use_wandb:
    values: [True]
  save_model:
    values: [True]
  wandb_save_model:
    values: [True]
  delete_local_models:
    values: [True]
  save_test_replays:
    values: [True]
  wandb_save_test_replays:
    values: [True]

  # everything on except Sacred cuz it suuucks
  use_sacred:
    values: [False]

  ##################
  # MARL alg config
  ##################
  # use hierarchical policy so we can load this data in post-processing for HL agent policy
  config:
    values: [maic]
  # config:
  #   values: [maic_comm_opt]
  # env_args.hierarchical:
  #   values: [True]
  lr:
    values: [0.00005]
  test_nepisode:
    values: [300]
  n_test_replays_save:
    values: [5]
  test_interval:
    values: [300000]
  # set test_interval = save_model_interval so you can load the model from any eval for further processing
  save_model_interval:
    values: [300000]

  # all values in the space-delimited list will be evaluated in a single run
  comms_values:
    values: [[0.0 0.25 0.5 0.75 0.9 1.0]]
  hl_task:
    values: [[0 1], [1 2]]

  # project-level success rate requirement
  # shouldn't need, but including just in case
  success_rate_spec:
    values: [0.0]

  terminate_on_task_completed:
    values: [True]

  ##################
  # Environment config
  ##################
  # basic env config
  env-config:
    values: [multigrid-lbf-v0]
  env_args.map_name:
    values: [3ga_2r_small_agents_placed]
  env_args.n_agents:
    values: [3]
  env_args.max_agent_level:
    values: [1]
  env_args.max_episode_steps:
    values: [50]
  t_max:
    values: [3050000]
  env_args.max_fruit_level:
    values: [3]
  env_args.force_coop:
    values: [True]

  # obs config
  env_args.state_type:
    values: [multigrid_flattened]
  env_args.sight:
    values: [7]
  env_args.obs_type:
    values: [multigrid_flattened]
  env_args.observe_other_agents:
    values: [False]

  # reward config
  env_args.reward_config.failed_load_penalty:
    values: [0.0, -0.01]

  # rendering
  env_args.highlight_visible_cells:
    values: [True]

  # experiment-specific env args
  env_args.max_num_fruit:
    values: [2]

  # hierarchical decision-making params for "project MDP"
  env_args.hl_env_args.task_type:
    values: [composed]

##################
# Conditional parameters
# use conditional params to specify single values to use for a given setup specified in "parameters" above
# don't nest these conditions deeper, it'll break something
##################
conditional_parameters:
  config:
    maic:
      mixer:
        values: [vdn]
