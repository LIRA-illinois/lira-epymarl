# config for a grid search experiment based on wandb sweep config
# meant to be used with grid_search_experiment.py

# params to grid search over
parameters:
  config:
    values: [maic]
  env-config:
    values: [foraging-v2]
  env_args.max_num_food:
    values: [2, 4]
  hidden_dim:
    values: [64, 128]
  lr:
    values: [0.0001, 0.0003, 0.0005]
  # seeds are grid-searched over too, but handled with a wrapper which assigns each combo of params a unique scenario index
  seed:
    values: [648, 2285, 123]
