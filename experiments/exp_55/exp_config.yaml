# params to grid search over
# all values assumed to be in lists

parameters:
  # varied params you want to print in the config table
  ##################
  # Seeds
  ##################
  # seeds are grid-searched over and are haPndled with a wrapper which assigns each combo of params (except seeds) a unique scenario index
  # use fixed seeds like this to enable reproducible results
  # seed:
  # values: [101, 202, 303]
  n_seeds:
    values: [3]

  ##################
  # Project setup + logging
  ##################
  wandb_project:
    values: [comm_experiments]
  # use offline mode to avoid wandb API rate limits for many parallel runs
  # need to sync to wandb server after a run is finished
  wandb_mode:
    values: [offline]
  use_wandb:
    values: [True]
  save_model:
    values: [True]
  wandb_save_model:
    values: [True]
  delete_local_models:
    values: [True]
  save_test_replays:
    values: [True]
  wandb_save_test_replays:
    values: [True]

  # everything on except Sacred cuz it suuucks
  use_sacred:
    values: [False]

  ##################
  # MARL alg config
  ##################
  config:
    values: [maic]
  mixer:
    values: [qmix]
  runner:
    values: [parallel_shared_memory]

  ##################
  # Environment config
  ##################
  batch_size_run:
    values: [25]
  lr:
    values: [0.00005]
  t_max:
    values: [5_000_000]
  epsilon_anneal_time:
    values: [2_000_000]
  test_nepisode:
    values: [50]
  test_interval:
    values: [500_000]
  save_model_interval:
    values: [500_000]
  n_test_replays_save:
    values: [5]

  msg_budget_per_agent:
    values: [[0, 1, 2]]
  msg_filter_type:
    values: [hard_topk]

  env-config:
    values: [team-nav-v0]
  env_args.map_name:
    values: [3ga_1r_two_level_small_hall]
  env_args.navigation_config:
    values:
      [
        submodules/gym-multigrid/gym_multigrid/envs/maps/team_navigation/navigation_branching_two_goals_small_hall.yaml,
      ]
  env_args.hierarchical:
    values: [True]
  env_args.n_agents:
    values: [3]
  env_args.n_agents_delay:
    values: [3]
  env_args.team_delay_prob:
    values: [0.10]
  correlated_exploration:
    values: [True]
  correlated_exploration_prob:
    values: [0.5]
  env_args.max_episode_steps:
    values: [15]
  env_args.terminate_on_task_completed:
    values: [True]
  env_args.goal_type:
    values: [simultaneous_arrival]
  env_args.reward_config.simultaneous_goal_reward_type:
    values: [per_step_arrival_group_size]

  hierarchical:
    values:
      - policy_scope: shared_across_contexts
        task_sequence: [[0, 1], [0, 2], [1, 3], [2, 3], [3, 4]]
        pg_values: [0.55, 0.65, 0.75, 0.85]
        epsilon_est: 0.01
        beta: 0.95
        epsilon_p: 0.05
        n_max: 5
        n_calibration_episodes: 100
        held_out_episodes: 50
        max_iterations: 10
        resume: none
