# params to grid search over
# all values assumed to be in lists

parameters:
    # varied params you want to print in the config table
    ##################
    # Seeds
    ##################
    # seeds are grid-searched over and are haPndled with a wrapper which assigns each combo of params (except seeds) a unique scenario index
    # use fixed seeds like this to enable reproducible results
    # seed:
    #   values: [101]
    # use random seeds for high-quality results to help avoid cherry picking seeds that make your results look good
    n_seeds:
        values: [3]

    ##################
    # Project setup + logging
    ##################
    wandb_project:
        values: [comm_experiments]
    # use offline mode to avoid wandb API rate limits for many parallel runs
    # need to sync to wandb server after a run is finished
    wandb_mode:
        values: [offline]
    use_wandb:
        values: [True]
    save_model:
        values: [True]
    wandb_save_model:
        values: [True]
    delete_local_models:
        values: [True]
    save_test_replays:
        values: [True]
    wandb_save_test_replays:
        values: [True]

    # everything on except Sacred cuz it suuucks
    use_sacred:
        values: [False]

    ##################
    # MARL alg config
    ##################
    mixer:
        values: [qmix]
    lr:
        values: [0.00005]
    t_max:
        values: [5050000]
    test_nepisode:
        values: [50]
    n_test_replays_save:
        values: [5]
    test_interval:
        values: [500000]
    save_model_interval:
        values: [500000]

    ##################
    # Environment config
    ##################
    # basic env config
    env-config:
        values: [multigrid-lbf-extended-v0]
    env_args.force_coop:
        values: [True]
    env_args.max_episode_steps:
        values: [50]
    env_args.n_agents:
        values: [3]
    env_args.max_fruit_level:
        values: [3]
    env_args.max_agent_level:
        values: [1]

    config:
        values: [qmix]
    env_args.map_name:
        values: [3ga_1r_small]
    # if fruit = 0, just use nav actions to simplify learning
    env_args.action_set:
        values: [AlternativeNavigationActions]
    env_args.max_num_fruit:
        values: [0]
    # task definition, speical reward function based on agent timing
    env_args.goal_type:
        values: [simultaneous_arrival]
    env_args.reward_config.simultaneous_goal_reward_type:
        values: [during_episode, terminal]

    # dynamics config
    env_args.chosen_move_prob:
        values: [1.0]

    # obs config
    env_args.state_type:
        values: [multigrid_flattened]
    env_args.obs_type:
        values: [multigrid_flattened]
    env_args.sight:
        values: [8]
    env_args.observe_other_agents:
        values: [True, False]

    # rendering
    env_args.highlight_visible_cells:
        values: [True]

##################
# Conditional parameters
# use conditional params to specify single values to use for a given setup specified in "parameters" above
# don't make these too complex or nest these deeper, it'll probably break something
##################
