mdp:
  initial_state: 0
  states: [0, 1, 3]
  goal_states: [3]
  transitions:
    - { from_state: 0, to_state: 1 }
    - { from_state: 1, to_state: 3 }

tasks:
  - id: 0_to_1
    from_state: 0
    to_state: 1
    goal_positions: [[3, 1], [3, 3], [3, 5], [3, 7], [3, 9]]
    init_state_dist:
      states: [[[1, 1], [1, 3], [1, 5], [1, 7], [1, 9]]]
      probs: [1.0]

  - id: 1_to_3
    from_state: 1
    to_state: 3
    goal_positions: [[6, 1], [6, 3], [6, 5], [6, 7], [6, 9]]
    init_state_dist:
      states: [[[3, 1], [3, 3], [3, 5], [3, 7], [3, 9]]]
      probs: [1.0]
