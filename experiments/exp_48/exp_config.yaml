# Compare a policy conditioned on communication budget against independent
# per-budget policies on the three-agent exp 47 benchmark.
parameters:
  n_seeds:
    values: [2]

  use_wandb:
    values: [False]
  use_sacred:
    values: [False]
  save_model:
    values: [False]

  config:
    values: [maic]
  mixer:
    values: [qmix]
  runner:
    values: [parallel_shared_memory]
  batch_size_run:
    values: [10]
  batch_size:
    values: [32]
  buffer_size:
    values: [5000]
  lr:
    values: [0.00005]
  t_max:
    values: [4_000_000]
  epsilon_anneal_time:
    values: [2_000_000]

  test_nepisode:
    values: [50]
  test_interval:
    values: [500000]
  log_interval:
    values: [500000]
  runner_log_interval:
    values: [500000]
  msg_filter_type:
    values: [hard_topk]
  policy_mode:
    values: [conditioned_shared, independent_reference]
  hidden_dim:
    values: [32, 64, 128]

  env-config:
    values: [team-nav-v0]
  env_args.map_name:
    values: [3ga_1r_small_hall]
  env_args.navigation_config:
    values:
      [
        submodules/gym-multigrid/gym_multigrid/envs/maps/team_navigation/navigation_branching_small_hall.yaml,
      ]
  env_args.hierarchical:
    values: [True]
  env_args.n_agents:
    values: [3]
  hl_task:
    values: [[0 1], [1, 3]]
  env_args.max_episode_steps:
    values: [15]
  env_args.terminate_on_task_completed:
    values: [True]
  env_args.goal_type:
    values: [simultaneous_arrival]
  env_args.reward_config.simultaneous_goal_reward_type:
    values: [per_step_arrival_group_size]
  env_args.team_delay_prob:
    values: [0.05, 0.1]
  env_args.n_agents_delay:
    values: [1]

conditional_parameters:
  policy_mode:
    conditioned_shared:
      condition_on_msg_budget:
        values: [True]
      condition_on_subtask:
        values: [True]
      unique_policy_per_msg_budget:
        values: [False]
      msg_budget_per_agent:
        values: [[0 1 2]]
    independent_reference:
      condition_on_msg_budget:
        values: [False]
      condition_on_subtask:
        values: [False]
      unique_policy_per_msg_budget:
        values: [True]
      msg_budget_per_agent:
        values: [[0 1 2]]

  hidden_dim:
    32:
      nn_hidden_size:
        values: [32]
    64:
      nn_hidden_size:
        values: [64]
    128:
      nn_hidden_size:
        values: [128]
