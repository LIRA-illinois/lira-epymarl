# params to grid search over
# all values assumed to be in lists

# Compare a policy conditioned on communication budget against independent
# per-budget policies on the three-agent exp 47 benchmark.
parameters:
  ##################
  # Seeds
  ##################
  # seeds are grid-searched over and are haPndled with a wrapper which assigns each combo of params (except seeds) a unique scenario index
  # use fixed seeds like this to enable reproducible results
  # seed:
  #     values: [878428 347277]
  n_seeds:
    values: [2]

  ##################
  # Project setup + logging
  ##################
  wandb_project:
    values: [comm_experiments]
  # use offline mode to avoid wandb API rate limits for many parallel runs
  # need to sync to wandb server after a run is finished
  wandb_mode:
    values: [offline]
  use_wandb:
    values: [True]
  save_model:
    values: [True]
  wandb_save_model:
    values: [True]
  delete_local_models:
    values: [True]
  save_test_replays:
    values: [True]
  wandb_save_test_replays:
    values: [True]

    # everything on except Sacred cuz it suuucks
  use_sacred:
    values: [False]

  ##################
  # MARL alg config
  ##################
  config:
    values: [maic]
  mixer:
    values: [qmix]
  runner:
    values: [parallel_shared_memory]
  # batch_size_run=10 can allow more runs while being fast, higher overall throughput for jobs w/ more runs
  # batch_size_run=20 is a good tradeoff between speeding up run time and RAM usage,
  # marginal speedup starts slowing down here, almost no benefit going above batch_size_run=40
  batch_size_run:
    values: [10]
  lr:
    values: [0.00005]
  t_max:
    values: [4_000_000]
  epsilon_anneal_time:
    values: [2_000_000]

  test_nepisode:
    values: [50]
  n_test_replays_save:
    values: [5]
  test_interval:
    values: [500_000]
  save_model_interval:
    values: [500_000]

  msg_filter_type:
    values: [hard_topk]
  policy_mode:
    values: [conditioned_shared, independent_reference]
  hidden_dim:
    values: [32, 64, 128]

  # # post_processing for after the run is done
  # post_processing:
  #     values: [aggregate_runs]
  # time_id:
  #     values: []

  env-config:
    values: [team-nav-v0]
  env_args.map_name:
    values: [3ga_1r_small_hall]
  env_args.navigation_config:
    values:
      [
        submodules/gym-multigrid/gym_multigrid/envs/maps/team_navigation/navigation_branching_small_hall.yaml,
      ]
  env_args.hierarchical:
    values: [True]
  env_args.n_agents:
    values: [3]
  hl_task:
    values: [[0 1], [1, 3]]
  env_args.max_episode_steps:
    values: [15]
  env_args.terminate_on_task_completed:
    values: [True]
  env_args.goal_type:
    values: [simultaneous_arrival]
  env_args.reward_config.simultaneous_goal_reward_type:
    values: [per_step_arrival_group_size]
  env_args.team_delay_prob:
    values: [0.1]
    # values: [0.05, 0.1]
  env_args.n_agents_delay:
    values: [1]

conditional_parameters:
  policy_mode:
    conditioned_shared:
      condition_on_msg_budget:
        values: [True]
      condition_on_subtask:
        values: [True]
      subtask_contexts:
        values:
          - [[0, 1], [1, 3]]
      unique_policy_per_msg_budget:
        values: [False]
      msg_budget_per_agent:
        values: [[0 1 2]]
    independent_reference:
      condition_on_msg_budget:
        values: [False]
      condition_on_subtask:
        values: [False]
      unique_policy_per_msg_budget:
        values: [True]
      msg_budget_per_agent:
        values: [[0 1 2]]

  hidden_dim:
    32:
      nn_hidden_size:
        values: [32]
    64:
      nn_hidden_size:
        values: [64]
    128:
      nn_hidden_size:
        values: [128]
