# Compare a single policy conditioned on communication budget and navigation
# subtask against an independently trained policy for every (task, budget).
parameters:
  n_seeds:
    values: [2]

  use_wandb:
    values: [False]
  use_sacred:
    values: [False]
  save_model:
    values: [False]

  config:
    values: [maic]
  mixer:
    values: [qmix]
  runner:
    values: [parallel_shared_memory]
  batch_size_run:
    values: [5]
  batch_size:
    values: [32]
  buffer_size:
    values: [5000]
  lr:
    values: [0.00005]
  test_nepisode:
    values: [10]
  test_interval:
    values: [50000]
  log_interval:
    values: [50000]
  runner_log_interval:
    values: [50000]
  epsilon_anneal_time:
    values: [20000]
  msg_filter_type:
    values: [hard_topk]
  policy_mode:
    values: [conditioned_shared, independent_reference]
  network_size:
    values: [small, medium]

  env-config:
    values: [team-nav-v0]
  env_args.map_name:
    values: [5ga_1r_small_hall]
  env_args.navigation_config:
    values:
      [experiments/exp_48/navigation_tasks.yaml]
  env_args.hierarchical:
    values: [True]
  env_args.n_agents:
    values: [5]
  env_args.max_episode_steps:
    values: [15]
  env_args.terminate_on_task_completed:
    values: [True]
  env_args.goal_type:
    values: [simultaneous_arrival]
  env_args.reward_config.simultaneous_goal_reward_type:
    values: [per_step_arrival_group_size]

conditional_parameters:
  policy_mode:
    conditioned_shared:
      condition_on_msg_budget:
        values: [True]
      condition_on_subtask:
        values: [True]
      subtask_contexts:
        values:
          - [[0, 1], [1, 3]]
      unique_policy_per_msg_budget:
        values: [False]
      msg_budget_per_agent:
        values: [[0 1 2 3 4]]
      t_max:
        values: [250000]
      epsilon_anneal_time:
        values: [200000]
    independent_reference:
      condition_on_msg_budget:
        values: [False]
      condition_on_subtask:
        values: [False]
      unique_policy_per_msg_budget:
        values: [True]
      msg_budget_per_agent:
        values: [[0 1 2 3 4]]
      hl_task:
        values: [[0 1], [1 3]]
      t_max:
        values: [25000]
      epsilon_anneal_time:
        values: [20000]

  network_size:
    small:
      hidden_dim:
        values: [32]
      nn_hidden_size:
        values: [32]
    medium:
      hidden_dim:
        values: [64]
      nn_hidden_size:
        values: [64]
