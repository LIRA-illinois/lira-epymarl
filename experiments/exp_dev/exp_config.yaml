# config for a grid search experiment based on wandb sweep config
# meant to be used with grid_search_experiment.py
# program: src/experiments/wandb_sweep_wrapper_single_seed.py
method: random
metric:
  goal: maximize
  name: test_return_mean

# params to grid search over
# all values assumed to be in lists
parameters:
  ##################
  # Seeds
  ##################
  # seeds are grid-searched over and are haPndled with a wrapper which assigns each combo of params (except seeds) a unique scenario index
  # use fixed seeds like this to enable reproducible results
  seed:
    values: [101]
  # use random seeds for high-quality results to help avoid cherry picking seeds that make your results look good
  # n_seeds:
  #   values: [3]

  ##################
  # Project setup + logging
  ##################
  wandb_project:
    values: [comm_experiments]
  wandb_mode:
    # values: [online]
    values: [offline]

  use_wandb:
    values: [True]
  save_test_replays:
    values: [True]
  # save_model:
  #   values: [True]
  # delete_local_models:
  #   values: [True]
  # live_render:
  #   values: [True]


  # everything off
  # use_wandb:
  #   values: [False]
  # save_test_replays:
  #   values: [False]
  # save_model:
  #   values: [False]
  # live_render:
  #   values: [False]


  # Sacred always off cuz it suuucks
  use_sacred:
    values: [False]

  ##################
  # MARL alg config
  ##################
  # config:
  #   values: [maic_comm_opt]
  # env_args.hierarchical:
  #   values: [True]
  config:
    values: [maic]
  lr:
    values: [0.00005]
  t_max:
    values: [20]
  test_interval:
    values: [10]
  save_model_interval:
    values: [20]
  runner_log_interval:
    values: [20]
  test_nepisode:
    values: [5]
  n_test_replays_save:
    values: [1]
  batch_size:
    values: [1]
  # target_update_interval:
  #   values: [1]

  # evaluate:
  #   values: [True]
  # eval_run_id:
  #   values: [orhckkhh]
  # load_step:
  #   values: [60, 120]

  # load_hlmdp_data:
  #   values: [True]
  # hlmdp_time_id:
  #   values: [exp_dev_26-06-10_16-25-32]

  ##################
  # Environment config
  ##################
  env-config:
    values: [multigrid-lbf-v0]
  manual_policy:
    values: [True]

  # comms allocation params
  # all values in the space-delimited list will be evaluated in a single run
  # only works for non-hierarchical version of the env, for hierarchical, these are considered "actions" in a high-level MDP
  comms_values_eval:
    # values: [[0.0 1.0]]
    values: [[0.0 1.0]]

  # hl_task:
  #   values: [[0 1], [1 2]]

  # project-level success rate requirement
  success_rate_spec:
    values: [0.0]

  env_args.map_name:
    # values: [1r_small]
    # values: [1r_small_agents_fruit_placed]
    values: [3ga_2r_small]
    # values: [3ga_2r_small_agents_placed]
    # values: [3ga_2r_small_agents_fruit_placed]
    # values: [3ga_2r_small]
  env_args.n_agents:
    values: [3]
  env_args.sight:
    values: [7]
  env_args.max_episode_steps:
    # values: [30]
    values: [10]
  # env_args.min_fruit_level:
  #   values: [2]
  env_args.force_coop:
    values: [True]
  env_args.max_fruit_level:
    values: [3]
  env_args.max_num_fruit_per_room:
    values: [3]

  # env_args.max_num_fruit:
  #   values: [2]
    # values: [3]
  env_args.state_type:
    values: [multigrid_flattened]
  env_args.obs_type:
    values: [multigrid_flattened]
  env_args.observe_other_agents:
    values: [False]

  env_args.highlight_visible_cells:
    values: [True]


  # hierarchical decision-making params for "project MDP"
  env_args.hl_env_args.task_type:
    values: [composed]

