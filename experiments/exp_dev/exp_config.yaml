# params to grid search over
# all values assumed to be in lists
parameters:
    ##################
    # Seeds
    ##################
    # seeds are grid-searched over and are haPndled with a wrapper which assigns each combo of params (except seeds) a unique scenario index
    # use fixed seeds like this to enable reproducible results
    seed:
        values: [101]
    # use random seeds for high-quality results to help avoid cherry picking seeds that make your results look good
    # n_seeds:
    #   values: [3]

    ##################
    # Project setup + logging
    ##################
    wandb_project:
        values: [comm_experiments]
    wandb_mode:
        # values: [online]
        values: [offline]

    use_wandb:
        values: [True]
    save_test_replays:
        values: [True]
    # save_model:
    #   values: [True]
    # delete_local_models:
    #   values: [True]
    live_render:
        values: [True]

    # everything off
    # use_wandb:
    #   values: [False]
    # save_test_replays:
    #   values: [False]
    # save_model:
    #   values: [False]
    # live_render:
    #     values: [False]

    ##################
    # MARL alg config
    ##################
    # config:
    #   values: [maic_comm_opt]
    # env_args.hierarchical:
    #   values: [True]
    config:
        values: [maic]
    lr:
        values: [0.00005]
    t_max:
        values: [10000, 10001]
        # values: [20, 30]
    test_interval:
        values: [10]
    save_model_interval:
        values: [20]
    runner_log_interval:
        values: [20]
    test_nepisode:
        values: [5]
    n_test_replays_save:
        values: [1]
    batch_size:
        values: [1]
    # target_update_interval:
    #   values: [1]

    # evaluate:
    #   values: [True]
    # eval_run_id:
    #   values: [orhckkhh]
    # load_step:
    #   values: [60, 120]

    # post_processing:
    #   values: [aggregate_runs]
    # time_id:
    #   values: [exp_dev_26-06-26_13-10-53]

    ##################
    # Environment config
    ##################
    env-config:
        values: [multigrid-lbf-v0]
    manual_policy:
        values: [True]

    # comms allocation params
    # all values in the space-delimited list will be evaluated in a single run
    # comms_values:
    #   values: [[0 1 2]]

    unique_policy_per_msg_budget:
        values: [False]

    env_args.chosen_move_prob:
        values: [1.0]

    env_args.asymmetric_fruit_obs:
        values: [different_sensors]

    env_args.num_agents_fruit_obs:
        values: [2]
        # values: [0, 1, 2, 3]

    env_args.smacv2_fruit_obs_prob:
        values: [0.0]

    # hl_task:
    #   values: [[0 1], [1 2]]

    # message filtering to model a constrained communication network
    msg_filter_type:
        values: [hard_topk]

    # project-level success rate requirement
    success_rate_spec:
        values: [0.0]

    action_selector:
        values: [action_space]

    env_args.map_name:
        values: [1r_small]
        # values: [1r_small_agents_fruit_placed]
        # values: [3ga_2r_small]
        # values: [3ga_2r_small_agents_placed]
        # values: [3ga_2r_small_agents_fruit_placed]
        # values: [3ga_2r_small]
    env_args.n_agents:
        values: [3]
    env_args.sight:
        values: [7]
    env_args.max_episode_steps:
        values: [10]
    env_args.max_agent_level:
        values: [1]
    env_args.force_coop:
        values: [True]
    env_args.max_fruit_level:
        values: [3]

    env_args.max_num_fruit:
        values: [2]

    env_args.state_type:
        values: [multigrid_flattened]
    env_args.obs_type:
        values: [multigrid_flattened]
    env_args.observe_other_agents:
        values: [False]

    env_args.highlight_visible_cells:
        values: [True]

    env_args.action_blocking:
        values: [False]

    # hierarchical decision-making params for "project MDP"
    # env_args.hl_env_args.task_type:
    #     values: [composed]

conditional_parameters:
    # example of how you would do the comms values for these different settings
    env_args.n_agents:
        3:
            # goes up to n_agents - 1 since we assume agents cannot send themselves a message
            msg_budget_per_agent:
                values: [[0 1 2]]
        # 5:
        #   # goes up to n_agents - 1 since we assume agents cannot send themselves a message
        #   msg_budget_per_agent:
        #     values: [[0 1 2 3 4]]
