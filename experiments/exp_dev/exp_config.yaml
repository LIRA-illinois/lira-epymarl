# config for a grid search experiment based on wandb sweep config
# meant to be used with grid_search_experiment.py
# program: src/experiments/wandb_sweep_wrapper_single_seed.py
method: random
metric:
  goal: maximize
  name: test_return_mean

# params to grid search over
# all values assumed to be in lists
parameters:
  ##################
  # Seeds
  ##################
  # seeds are grid-searched over and are handled with a wrapper which assigns each combo of params (except seeds) a unique scenario index
  # use fixed seeds like this to enable reproducible results
  seed:
    values: [101]
  # use random seeds for high-quality results to help avoid cherry picking seeds that make your results look good
  # n_seeds:
  #   values: [3]

  ##################
  # Project setup + logging
  ##################
  wandb_project:
    values: [comm_experiments]
  # everything on
  # use_wandb:
  #   values: [True]
  # use_sacred:
  #   values: [True]
  # save_model:
  #   values: [True]
  # wandb_save_model:
  #   values: [True]
  # save_test_replays:
  #   values: [True]
  # wandb_save_test_replays:
  #   values: [True]
  # live_render:
  #   values: [True]

  # everything off
  use_wandb:
    values: [False]
  use_sacred:
    values: [False]
  save_model:
    values: [False]
  wandb_save_model:
    values: [False]
  save_test_replays:
    values: [False]
  wandb_save_test_replays:
    values: [False]
  # live_render:
  #   values: [False]

  # live replays saved
  live_render:
    values: [True]

  ##################
  # MARL alg config
  ##################
  config:
    values: [maic_comm_opt]
  # config:
  #   values: [maic]
  lr:
    values: [0.00005]

  t_max:
    values: [100]
  test_nepisode:
    values: [1]

  ##################
  # Environment config
  ##################
  env-config:
    values: [multigrid-lbf-v0]
  env_args.map_name:
    values: [3ga_2r_small_agents_placed]
    # values: [3ga_2r_small]
  env_args.n_agents:
    values: [3]
  env_args.sight:
    values: [2]
  env_args.max_episode_steps:
    values: [10]
  env_args.max_num_fruit:
    values: [0]
    # values: [2]
  env_args.state_type:
    values: [multigrid_flattened]
  env_args.obs_type:
    values: [multigrid_flattened]

  # comms allocation params
  env_args.team_bandwidth_allocation_action:
    values: [True]
  env_args.num_comms_values:
    values: [3]

  # hierarchical decision-making params for "project MDP"
  env_args.hierarchical:
    values: [True]
  env_args.task_type:
    values: [composed]




