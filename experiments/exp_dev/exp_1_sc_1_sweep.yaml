program: src/experiments/wandb_sweep_wrapper_single_seed.py
name: exp_1_sc_1
method: grid # grid, random, or Bayes
# if you choose random or Bayes, the run will probably not do all seeds
# the only way to have mixed grid-searched params and random search params is with an external wrapper
metric:
  name: test_return_mean
  goal: maximize

parameters:
  # constant params for this experiment
  run_name:
    values: [exp_1_sc_1]
  log_interval:
    values: [200]
  config:
    values: [maic]
  env-config:
    values: [foraging-v2]

  # params to search over using one of wandb's search strategies
  seed:
    values: [648]
  env_args.max_num_food:
    values: [2, 4, 6, 8]
  lr:
    values: [0.0001, 0.0005, 0.0001]
