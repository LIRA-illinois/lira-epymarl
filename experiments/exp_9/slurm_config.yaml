time: "0-48:00:00"
memory_gb: 64
# number of CPU cores available to each task in your job. 1 task = 1 python cmd
# called cpus-per-tasks on Delta and ntasks on campus cluster
cpus_per_task: 64

delta_config: {
  partition: "gpuA40x4,gpuA100x4,gpuA100x8",
  gpus_per_node: 1,
  # nodes that are known to have issues
  exclude: "gpua076,gpua086"
  # 3/27/26 - gpua076,gpua086 give "RuntimeError: CUDA error: CUDA-capable device(s) is/are busy or unavailable" when you try to put anything on the device, not an issue w/ my code since other nodes do not give this issue
  }

campus_config: {
  # specifying partitions and GPUs like this means I'm indifferent between my job
  # running on IllinoisComputes-GPU on a A100 or H200 GPU
  partition: "IllinoisComputes-GPU,eng-research-gpu,csl",
  gpus_per_node: 1,
  # nodes that are known to have issues
  exclude: ""
}
