# params to grid search over
# all values assumed to be in lists

run_priority:
  env_args.n_agents: [3, 6]
  hl_task: [["0 1"], ["1 3"]]

parameters:
  n_seeds:
    values: [2]

  wandb_project:
    values: [comm_experiments]
  wandb_mode:
    values: [offline]
  use_wandb:
    values: [True]
  save_model:
    values: [True]
  wandb_save_model:
    values: [True]
  delete_local_models:
    values: [True]
  save_test_replays:
    values: [True]
  wandb_save_test_replays:
    values: [True]
  use_sacred:
    values: [False]

  config:
    values: [maic]
  mixer:
    values: [qmix]
  runner:
    values: [parallel_shared_memory]
  batch_size_run:
    values: [10]
  lr:
    values: [0.00005]
  t_max:
    values: [4_050_000]
  epsilon_anneal_time:
    values: [2_000_000]

  test_nepisode:
    values: [50]
  n_test_replays_save:
    values: [5]
  test_interval:
    values: [500_000]
  save_model_interval:
    values: [500_000]

  correlated_exploration:
    values: [True]
  correlated_exploration_prob:
    values: [0.5]
  unique_policy_per_msg_budget:
    values: [True]
  msg_budget_per_agent:
    values: [[0 1 2]]
  msg_filter_type:
    values: [hard_topk]
  # prob of at least 1 message on the team being sent by an agent, but not received
  # by its intended recipient (i.e., the comms network drops the message)
  # you could probably do like 3 or 4 of these, want a denser sampling of it
  team_msg_drop_rate:
    values: [0.0, 0.1, 0.3, 0.5]

  env-config:
    values: [team-nav-v0]
  env_args.map_name:
    values: [3ga_1r_small_hall]
  env_args.navigation_config:
    values:
      [
        submodules/gym-multigrid/gym_multigrid/envs/maps/team_navigation/navigation_branching_small_hall.yaml,
      ]
  env_args.hierarchical:
    values: [True]
  hl_task:
    values: [[0 1], [1 3]]
  env_args.terminate_on_task_completed:
    values: [True]
  env_args.max_episode_steps:
    values: [15]
  env_args.n_agents:
    values: [3, 6]

  env_args.goal_type:
    values: [simultaneous_arrival]
  env_args.reward_config.simultaneous_goal_reward_type:
    values: [per_step_arrival_group_size]

  # prob that at least 1 agent of the candidate n_agents_delay is delayed at each time step
  env_args.team_delay_prob:
    values: [0.05, 0.1]

conditional_parameters:
  msg_budget_per_agent:
    "0":
      config:
        values: [qmix]

  env_args.n_agents:
    3:
      env_args.n_agents_delay:
        values: [1, 2, 3]
    6:
      env_args.n_agents_delay:
        values: [2, 4, 6]
