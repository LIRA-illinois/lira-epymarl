# params to grid search over
# all values assumed to be in lists

parameters:
    # varied params you want to print in the config table
    ##################
    # Seeds
    ##################
    # seeds are grid-searched over and are haPndled with a wrapper which assigns each combo of params (except seeds) a unique scenario index
    # use fixed seeds like this to enable reproducible results
    # seed:
    #     values: [878428 347277]
    n_seeds:
        values: [1]

    ##################
    # Project setup + logging
    ##################
    wandb_project:
        values: [comm_experiments]
    # use offline mode to avoid wandb API rate limits for many parallel runs
    # need to sync to wandb server after a run is finished
    wandb_mode:
        values: [offline]
    use_wandb:
        values: [True]
    save_model:
        values: [True]
    wandb_save_model:
        values: [True]
    delete_local_models:
        values: [True]
    save_test_replays:
        values: [True]
    wandb_save_test_replays:
        values: [True]

    # everything on except Sacred cuz it suuucks
    use_sacred:
        values: [False]

    ##################
    # MARL alg config
    ##################
    config:
        values: [maic]
    mixer:
        values: [qmix]
    runner:
        values: [parallel_shared_memory]
    # batch_size_run=20 is a good tradeoff between speeding up run time and RAM usage,
    # marginal speedup starts slowing down here, almost no benefit going above batch_size_run=40
    batch_size_run:
        values: [20]
    lr:
        values: [0.00005]
    t_max:
        values: [8_050_000]
    epsilon_anneal_time:
        values: [2_000_000]
    early_stopping:
        values: [True]

    early_stopping_window:
        values: [1_000_000]
    early_stopping_min_delta:
        values: [0.01]
    # the agents have to
    early_stopping_min_success_lcb:
        values: [0.80]
    early_stopping_confidence:
        values: [0.90]

    test_nepisode:
        values: [50]
    n_test_replays_save:
        values: [5]
    test_interval:
        values: [500_000]
    save_model_interval:
        values: [500_000]

    correlated_exploration:
        values: [True]
    correlated_exploration_prob:
        values: [0.5]

    unique_policy_per_msg_budget:
        values: [True]
    # all values in the space-delimited list will be evaluated in a single run
    # goes up to n_agents - 1 since we assume agents cannot send themselves a message
    msg_budget_per_agent:
        values: [[0 1 2]]
    # message filtering to model a constrained communication network
    msg_filter_type:
        values: [hard_topk]

    msg_drop_rate:
        values: [0.0, 0.1, 0.2]

    # # post_processing for after the run is done
    # post_processing:
    #     values: [aggregate_runs]
    # time_id:
    #     values: []

    ##################
    # Environment config
    ##################
    # basic env config
    env-config:
        values: [team-nav-v0]
    env_args.map_name:
        values: [3ga_1r_small_hall]
    # Shared directed HL graph and per-transition navigation tasks.
    env_args.navigation_config:
        values:
            [
                submodules/gym-multigrid/gym_multigrid/envs/maps/team_navigation/navigation_branching_small_hall.yaml,
            ]
    env_args.hierarchical:
        values: [True]
    # Train each directed subtask as an independent low-level scenario.
    hl_task:
        values: [[0 1], [1 3]]
    env_args.terminate_on_task_completed:
        values: [True]
    env_args.max_episode_steps:
        values: [15]
    env_args.n_agents:
        values: [3]

    # task definition, speical reward function based on agent timing
    env_args.goal_type:
        values: [simultaneous_arrival]
    env_args.reward_config.simultaneous_goal_reward_type:
        values: [per_step_arrival_group_size]

    env_args.n_agents_delay:
        values: [1, 2, 3]
    # env_args.agent_delay_prob:
    #     values: [0.0]

##################
# Conditional parameters
# use conditional params to specify single values to use for a given setup specified in "parameters" above
# don't make these too complex or nest these deeper, it'll probably break something
##################
conditional_parameters:
    env_args.n_agents_delay:
        1:
            env_args.agent_delay_prob:
                values: [0.1, 0.2]
        2:
            env_args.agent_delay_prob:
                values: [0.1]
        3:
            env_args.agent_delay_prob:
                values: [0.1]

    msg_budget_per_agent:
        "0":
            config:
                values: [qmix]
