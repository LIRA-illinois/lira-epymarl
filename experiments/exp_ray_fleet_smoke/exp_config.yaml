# Short independent-subtask experiment for exercising the Ray lab fleet.
# Two subtasks x eight seeds produce 16 runs to distribute across GPU slots.
parameters:
  n_seeds:
    values: [8]

  config:
    values: [maic]
  mixer:
    values: [qmix]
  runner:
    values: [parallel_shared_memory]
    # batch_size_run=20 is a good tradeoff between speeding up run time and RAM usage,
    # marginal speedup starts slowing down here, almost no benefit going above batch_size_run=40
  batch_size_run:
    values: [10]
  t_max:
    values: [5000]
  use_cuda:
    values: [True]
  use_sacred:
    values: [False]

  use_wandb:
    values: [True]
  wandb_project:
    values: [ray_lab_fleet_smoke]
  wandb_mode:
    values: [offline]
  save_model:
    values: [False]
  wandb_save_model:
    values: [False]
  save_test_replays:
    values: [False]
  wandb_save_test_replays:
    values: [False]

  test_nepisode:
    values: [1]
  test_interval:
    values: [1000]
  runner_log_interval:
    values: [100]
  learner_log_interval:
    values: [100]
  log_interval:
    values: [100]

  env-config:
    values: [team-nav-v0]
  env_args.map_name:
    values: [3ga_1r_small_hall]
  env_args.navigation_config:
    values:
      - submodules/gym-multigrid/gym_multigrid/envs/maps/team_navigation/navigation_branching_small_hall.yaml
  env_args.hierarchical:
    values: [True]
  hl_task:
    values: [[0 1], [1 3]]
  env_args.terminate_on_task_completed:
    values: [True]
  env_args.max_episode_steps:
    values: [15]
  env_args.n_agents:
    values: [3]
  env_args.goal_type:
    values: [simultaneous_arrival]
  env_args.reward_config.simultaneous_goal_reward_type:
    values: [per_step_arrival_group_size]
