[project]
name = "lira-epymarl"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    { name = "Jacob Heglund", email = "jheglun2@illinois.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "absl-py>=0.1.0",
    "gymnasium[other]>=0.28", # [other] includes extra packages to record env replays
    "gurobipy>=13.0.0",
    "ipdb",
    "matplotlib>=3.10.6",
    "networkx",
    "numpy>=2.3.2",
    "pandas>=3.0.0",
    "protobuf>=3.20.0",
    "psutil",
    "pysc2>=3.0.0",
    "pyyaml>=6.0.2",
    "sacred==0.8.7",
    "setuptools==81.0.0", # setuptools 81.0.0 is required for sacred to work
    "s2clientprotocol>=4.10.1.75800.0",
    "statsmodels",
    "tensorboard>=2.20.0",
    "tensorboard-logger",
    "torch==2.6.0",
    "wandb>=0.25.1"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
# only use poetry for dependency management, not to create an importable package from this project, do this to avoid changing the directory structure to that required for an importable package
package-mode = false

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
