env: multigrid-team-navigation-v0

env_args:
    # size of the area accessible by the agents
    map_name: ""
    width: 10
    height: 10
    n_agents: 4
    sight: 2
    max_episode_steps: 50

    state_type: multigrid_flattened
    obs_type: multigrid_flattened

    # only works for multigrid obs
    highlight_visible_cells: False

learner_log_interval: 10000
log_interval: 10000
runner_log_interval: 10000
t_max: 2050000
test_interval: 10000
test_nepisode: 40
