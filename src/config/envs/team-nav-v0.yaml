env: team-nav-v0

env_args:
    # size of the area accessible by the agents
    map_name: ""
    width: 10
    height: 10
    n_agents: 4
    max_episode_steps: 50

    state_type: simple_navigation_features
    obs_type: simple_navigation_features

learner_log_interval: 10000
log_interval: 10000
runner_log_interval: 10000
t_max: 3000000
test_interval: 10000
test_nepisode: 40

# Optional MAPF-guided exploration settings. Enable with
# action_selector=mapf_epsilon_greedy in an algorithm config or override.
mapf_start_steps: 0
mapf_end_steps: 1000000
